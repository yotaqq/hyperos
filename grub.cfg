# GRUB configuration for HyperOS

# Set default menu entry
set default=0

# Set timeout to 3 seconds
set timeout=3

# Menu entry for HyperOS
menuentry "HyperOS v0.1" {
    multiboot2 /boot/kernel.bin
    boot
}

# Menu entry for HyperOS with serial output
menuentry "HyperOS v0.1 (Serial Console)" {
    multiboot2 /boot/kernel.bin
    boot
}
